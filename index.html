<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kerstliedjes</title>
<meta name="theme-color" content="#b23a2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kerstliedjes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#f6f3ee; --card:#fff; --ink:#1f1d1a; --muted:#7a746b; --line:#e6e0d6;
    --accent:#b23a2e; --accent-ink:#fff; --active:#fbeeec;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16140f; --card:#211e18; --ink:#f1ece4; --muted:#a39b8f; --line:#353027; --accent:#e0614f; --active:#3a2420; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px 210px}
  h1{font-size:28px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
  li.active{background:var(--active);border-color:var(--accent)}
  .num{width:24px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;flex:none}
  li.active .num{color:var(--accent);font-weight:700}
  .name{flex:1;min-width:0}
  .len{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .offline{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
  .player{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
  .pin{max-width:560px;margin:0 auto}
  .now{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:22px}
  .bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar input{flex:1;accent-color:var(--accent)}
  .btns{display:flex;justify-content:center;align-items:center;gap:18px}
  .pb{border:none;background:transparent;color:var(--ink);font-size:24px;width:48px;height:48px;border-radius:50%;cursor:pointer}
  .pb.main{background:var(--accent);color:var(--accent-ink);width:60px;height:60px;font-size:26px}
  .pb.on{color:var(--accent)}
  .pb.off{opacity:.35}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kerstliedjes</h1>
  <div class="sub" id="sub"></div>
  <ol id="list"></ol>
  <div class="offline" id="offline"></div>
</div>

<div class="player">
  <div class="pin">
    <div class="now" id="now">Tik op een liedje om te beginnen</div>
    <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" step="0.1"><span id="dur">0:00</span></div>
    <div class="btns">
      <button class="pb off" id="loop" title="Herhaal alles">🔁</button>
      <button class="pb" id="prev" title="Vorige">⏮</button>
      <button class="pb main" id="play" title="Afspelen">▶</button>
      <button class="pb" id="next" title="Volgende">⏭</button>
      <button class="pb off" id="one" title="Herhaal dit liedje">🔂</button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const TRACKS = [
  ["Wij komen tezamen",        "audio/01-wij-komen-tesamen.mp3",        139],
  ["Maria die zoude",          "audio/02-maria-die-zoude.mp3",          84],
  ["Wiegelied",                "audio/03-wiegelied.mp3",                102],
  ["De herdertjes",            "audio/04-de-herdertjes.mp3",            99],
  ["Gloria",                   "audio/05-gloria.mp3",                   119],
  ["Er is een kindeke",        "audio/06-er-is-een-kindeke.mp3",        149],
  ["Daar boven aan de hemel",  "audio/07-daar-boven-aan-de-hemel.mp3",  137],
  ["Midden in de winternacht", "audio/08-midden-in-de-winternacht.mp3", 88],
  ["Stille nacht",             "audio/09-stille-nacht.mp3",             89],
  ["Klokken",                  "audio/10-klokken.mp3",                  119],
];
const $ = id => document.getElementById(id);
const audio = $('audio');
let current = -1, loopAll = false, loopOne = false;
try { loopAll = localStorage.getItem('loopAll')==='1'; loopOne = localStorage.getItem('loopOne')==='1'; } catch(e){}

const fmt = s => { if(!isFinite(s)) return '0:00'; s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const total = TRACKS.reduce((a,t)=>a+t[2],0);
$('sub').textContent = `${TRACKS.length} liedjes · ${Math.round(total/60)} minuten`;

function render(){
  const ol = $('list'); ol.innerHTML='';
  TRACKS.forEach(([name,,len],i)=>{
    const li = document.createElement('li');
    if(i===current) li.className='active';
    li.innerHTML = `<span class="num">${i===current && !audio.paused ? '♪' : i+1}</span><span class="name"></span><span class="len">${fmt(len)}</span>`;
    li.querySelector('.name').textContent = name;
    li.onclick = ()=> (i===current ? toggle() : playIndex(i));
    ol.appendChild(li);
  });
  $('now').textContent = current>=0 ? TRACKS[current][0] : 'Tik op een liedje om te beginnen';
  $('play').textContent = audio.paused ? '▶' : '⏸';
  $('loop').classList.toggle('off',!loopAll); $('loop').classList.toggle('on',loopAll);
  $('one').classList.toggle('off',!loopOne);  $('one').classList.toggle('on',loopOne);
}

function playIndex(i){
  if(i<0 || i>=TRACKS.length) return;
  current = i;
  audio.src = TRACKS[i][1];
  audio.play().catch(()=>{});
  setMedia(); render();
}
function toggle(){
  if(current<0) return playIndex(0);
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
}
function next(){
  if(current < TRACKS.length-1) playIndex(current+1);
  else if(loopAll) playIndex(0);
  else { audio.pause(); audio.currentTime=0; render(); }
}
function prev(){
  if(audio.currentTime > 3 || current<=0){ audio.currentTime = 0; return; }
  playIndex(current-1);
}
$('play').onclick = toggle;
$('next').onclick = next;
$('prev').onclick = prev;
$('loop').onclick = ()=>{ loopAll=!loopAll; try{localStorage.setItem('loopAll',loopAll?'1':'0')}catch(e){} render(); };
$('one').onclick  = ()=>{ loopOne=!loopOne; try{localStorage.setItem('loopOne',loopOne?'1':'0')}catch(e){} render(); };
audio.onended = ()=>{ if(loopOne){ audio.currentTime=0; audio.play().catch(()=>{}); } else next(); };
audio.onplay = audio.onpause = render;
audio.ontimeupdate = ()=>{
  $('cur').textContent = fmt(audio.currentTime);
  $('dur').textContent = fmt(audio.duration);
  if(audio.duration) $('seek').value = audio.currentTime/audio.duration*100;
};
$('seek').oninput = e=>{ if(audio.duration) audio.currentTime = e.target.value/100*audio.duration; };

function setMedia(){
  try{
    if(!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: TRACKS[current][0], album: 'Kerstliedjes',
      artwork: [{src:'icons/icon-512.png', sizes:'512x512', type:'image/png'}]
    });
    navigator.mediaSession.setActionHandler('nexttrack', next);
    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('play', ()=>audio.play());
    navigator.mediaSession.setActionHandler('pause', ()=>audio.pause());
  }catch(e){}
}

// Offline: service worker slaat alle liedjes op
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>{
    navigator.serviceWorker.addEventListener('message', e=>{
      if(e.data==='cached') $('offline').textContent = '✓ Alle liedjes staan op je telefoon en werken ook offline.';
    });
    caches.has('kerst-v1').then(async has=>{
      if(!has) return;
      const c = await caches.open('kerst-v1');
      const keys = await c.keys();
      if(keys.filter(k=>k.url.endsWith('.mp3')).length===TRACKS.length)
        $('offline').textContent = '✓ Alle liedjes staan op je telefoon en werken ook offline.';
      else $('offline').textContent = 'Liedjes worden opgeslagen voor offline gebruik…';
    });
  }).catch(()=>{});
}
render();
</script>
</body>
</html>
